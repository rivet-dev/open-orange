name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm validate:examples
      - run: pnpm test:packages
      - name: Check that every test file is in one test area
        run: pnpm test:area --check
      - name: Check the published package contents
        run: npm pack --dry-run

  test:
    name: e2e / ${{ matrix.area }}
    # Each job runs the test files of one Cloudflare area (tests/test-areas.ts), so the failing
    # check names the area. The files start many `orange dev` processes and engines, so the big
    # areas get more cores.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { area: durable-objects, runner: depot-ubuntu-24.04-16 }
          - { area: rpc-and-websockets, runner: depot-ubuntu-24.04-16 }
          - { area: bindings, runner: depot-ubuntu-24.04-16 }
          - { area: events, runner: depot-ubuntu-24.04-8 }
          - { area: node-compat, runner: depot-ubuntu-24.04-8 }
          - { area: cli, runner: depot-ubuntu-24.04-16 }
          - { area: migrate, runner: depot-ubuntu-24.04-8 }
          - { area: examples, runner: depot-ubuntu-24.04-8 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:area ${{ matrix.area }}
