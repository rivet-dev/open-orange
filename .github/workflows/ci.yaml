name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  areas:
    name: Areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.areas.outputs.areas }}
    steps:
      - uses: actions/checkout@v4
      # Each folder of tests/ that holds *.test.ts files is one e2e area. A test file directly in
      # tests/ belongs to no area and would never run, so it fails here.
      - id: areas
        run: |
          if ls tests/*.test.ts > /dev/null 2>&1; then
            echo "::error::Move these into a tests/<area>/ folder: $(ls tests/*.test.ts)"
            exit 1
          fi
          echo "areas=$(ls tests/*/*.test.ts | xargs -n1 dirname | xargs -n1 basename | sort -u | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm validate:examples
      - run: pnpm test:unit
      - name: Check the published package contents
        run: npm pack --dry-run

  e2e:
    name: e2e / ${{ matrix.area }}
    needs: areas
    # The tests start many `orange dev` processes and engines. An 8-core runner starves.
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.areas.outputs.areas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e 'tests/${{ matrix.area }}/*.test.ts'

  workerd-parity:
    name: workerd parity
    # Runs the Orange-written synthetic/ tests, scored on workerd first. A test that fails here and
    # not in results/latest.json fails the job.
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install capnp
        run: |
          sudo apt-get install -y --no-install-recommends capnproto ||
            { sudo apt-get update && sudo apt-get install -y --no-install-recommends capnproto; }
      - uses: actions/cache@v4
        with:
          path: packages/cloudflare-conformance/.upstream/cache
          key: workerd-tests-${{ hashFiles('packages/cloudflare-conformance/upstream.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/cloudflare-conformance upstream --filter 'synthetic--' --jobs 8 --baseline results/latest.json
